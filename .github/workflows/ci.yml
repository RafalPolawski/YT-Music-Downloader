name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Test on the Python of the Docker image, so a base image update is tested before it ships.
      - name: Python version of the Docker image
        id: python
        run: |
          version=$(sed -n 's/^FROM python:\([0-9][0-9.]*\).*/\1/p' Dockerfile)
          if [ -z "$version" ]; then echo "::error::No 'FROM python:X.Y' line in the Dockerfile"; exit 1; fi
          echo "Docker image uses Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # Same static ffmpeg build as the Docker image (and no dependency on apt mirrors).
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          image=$(sed -n 's/^FROM \(mwader\/static-ffmpeg:[^ ]*\).*/\1/p' Dockerfile)
          id=$(docker create "$image")
          sudo docker cp "$id:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$id:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$id" > /dev/null
          ffmpeg -version | head -n 1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        timeout-minutes: 5
        run: python -m pytest -q

name: Release

# Two ways to publish a version (both need a CHANGELOG.md entry and the same
# __version__ in ytmd/__init__.py):
#   - push a tag:  git tag v1.2.3 && git push origin v1.2.3
#   - or Actions tab -> Release -> Run workflow -> version 1.2.3
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          app=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ytmd/__init__.py)
          if [ "$app" != "$version" ]; then
            echo "::error::Releasing $version but ytmd/__init__.py says $app"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            /^\[[^]]*\]: / { if (found) exit }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo
            echo "### Docker image"
            echo
            echo "\`${image}:${VERSION}\` (also \`:latest\`) for linux/amd64 and linux/arm64."
            echo "Download the attached \`docker-compose.yml\`, set your music folder and run \`docker compose up -d\`."
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.tag }}
          body_path: notes.md
          files: docker-compose.yml

      # A tag created by this workflow does not trigger other workflows, so start the
      # image build for it explicitly (a pushed tag already triggers docker.yml).
      - name: Build the Docker image
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.v.outputs.tag }}"
